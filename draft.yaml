models:
  Associado:
      id: id
      foto: string nullable
      nome: string
      status: enum:"ativo","inativo","falecido" default:"ativo"
      data_nascimento: date
      nome_social: string nullable
      sexo: enum:"masculino","feminino"
      declaracao_sexual: enum:"heterossexualidade","homossexualidade","bissexualidade","transsexualidade","panssexualidade","assexualidade","intergenero" nullable
      cpf: string nullable
      rg: string nullable
      orgao_expedidor: enum:"abnc","cgpi_durex_dpf","cgpi","cgpmaf","cnig","cnt","coren","cra","cras","crb","crc","cre","crea","creci","crefito","crf","crm","crn","cro","crp","crpre","crq","crrc","crmv","csc" nullable
      orgao_expedidor_uf: enum:"ac","al","ap","am","ba","ce","df","es","go","ma","mt","ms","mg","pa","pb","pr","pe","pi","rj","rn","rs","ro","rr","sc","sp","se","to" nullable
      estado_civil: enum:"solteiro","casado","divorciado","viuvo","separado_judicialmente"
      certidao_nascimento: string nullable
      naturalidade_ibge: string
      mae: string
      pai: string nullable
      religiao: enum:"mormons","protestante","espiritismo","umbanda","budismo","candomble","judaismo","tradicoes_esotericas","islamismo","crencas_indigenas","catolico","ateu","outras"
      escolaridade: enum:"sem_escolaridade","ensino_fundamental_incompleto","ensino_fundamental","ensino_medio_incompleto","ensino_medio","ensino_superior_incompleto","ensino_superior","mestrado","doutorado"
      raca: enum:"branca","negra","amarela","parda","indigena","ignorado"
      cid10: json
      crm: string nullable
      causa_deficiencia: enum:"acidente_de_trabalho","artrite_reumatoide","acidente_domestico","acidente","poliomielite","congenito","polio","avc","acidente_de_transito","meningite","sequelas_poliomielite","paralisia_cerebral","hanseniase","reumatismo","pci"
      tipo_deficiencia: enum:"visual","auditiva","mental","fisica","multipla","intelectual"
      aparelho_utilizado: enum:"cadeira_de_rodas","andador","muleta","bengala","parafusos","perna_mecanica","bengala_canadense","bastao","muletas_auxiliares","braco_mecanico","oculos_e_protese","muleta_canadense","protese","protese_auricular","coupar","muletas","colete","bota_ortopedica","oculos","fistula","protese_ocular","fistula_mse","fistula_msd","fistula_esquerda","bolsa_de_colostomia" nullable
      cep: integer
      ocupacao: enum:"estudante","empresario","funcionario_publico","bancario","militar","autonomo","aposentado","pensionista","funcionario_privado","dono_de_casa","profissional_liberal" nullable
      rua: string
      bairro: string
      numero: string
      estado: string
      cidade: string
      perimetro: string
      telefone_celular: string nullable
      telefone_whatsapbigintp: string nullable
      telefone_fixo: string nullable
      email: string nullable
      relationships:
        hasMany: Carteirinha
        belongsToMany: Beneficio
  Beneficio:
      id: id
      nome: string nullable
      descricao: string
  Carteirinha:
      id: id foreign:associados.id
      status: enum:"ativa","cancelada","vencida"
      data_emissao: date
      data_vencimento: date
seeders: Associado
