[packages]
php = "8.2"
composer = "*"
nodejs = "18"

[variables]
NPM_CONFIG_INCLUDE = "dev"
NODE_ENV = "development"

[phases.setup]
nixPkgs = ["php82", "php82Packages.composer", "nodejs-18_x", "python311Packages.supervisor", "nginx", "php82Extensions.redis", "php82Extensions.pdo_mysql", "php82Extensions.bcmath", "php82Extensions.gd", "php82Extensions.zip", "php82Extensions.intl", "php82Extensions.opcache", "php82Extensions.pcntl", "php82Extensions.exif", "php82Extensions.ftp"]

[phases.install]
dependsOn = ["setup"]
cmds = ["echo 'Skipping default install phase to save RAM'"]

[phases.build]
dependsOn = ["install"]
cmds = [
    "npm install --include=dev --no-audit --no-fund --loglevel=error --ignore-scripts --prefer-offline",
    "composer install --no-dev --optimize-autoloader --no-scripts",
    "npm run build",
    "composer dump-autoload --optimize",
    "mkdir -p /etc/supervisor/conf.d/",
    "cp /assets/worker-*.conf /etc/supervisor/conf.d/",
    "cp /assets/supervisord.conf /etc/supervisord.conf",
    "chmod +x /assets/start.sh"
]

[start]
cmd = '/assets/start.sh'

[staticAssets]
"start.sh" = '''
#!/bin/bash
mkdir -p /var/log/nginx
mkdir -p /var/lib/nginx/body
touch /var/log/nginx-access.log
touch /var/log/nginx-error.log

# Copy config and replace PORT
cp /assets/nginx.template.conf /etc/nginx.conf
sed -i "s/PORT_PLACEHOLDER/${PORT:-80}/g" /etc/nginx.conf

# Start supervisor
supervisord -c /etc/supervisord.conf -n
'''

"supervisord.conf" = '''
[unix_http_server]
file=/assets/supervisor.sock

[supervisord]
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/assets/supervisord.pid
nodaemon=false
silent=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///assets/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf
'''

"worker-nginx.conf" = '''
[program:worker-nginx]
process_name=%(program_name)s_%(process_num)02d
command=nginx -c /etc/nginx.conf
autostart=true
autorestart=true
stdout_logfile=/var/log/worker-nginx.log
stderr_logfile=/var/log/worker-nginx.log
'''

"worker-phpfpm.conf" = '''
[program:worker-phpfpm]
process_name=%(program_name)s_%(process_num)02d
command=php-fpm -y /assets/php-fpm.conf -F -R
autostart=true
autorestart=true
stdout_logfile=/var/log/worker-phpfpm.log
stderr_logfile=/var/log/worker-phpfpm.log
'''

"worker-laravel.conf" = '''
[program:worker-laravel]
process_name=%(program_name)s_%(process_num)02d
command=bash -c 'exec php /app/artisan queue:work --sleep=3 --tries=3 --max-time=3600'
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=2
startsecs=1
stopwaitsecs=3600
stdout_logfile=/var/log/worker-laravel.log
stderr_logfile=/var/log/worker-laravel.log
'''

"nginx.template.conf" = '''
user root;
worker_processes auto;
pid /assets/nginx.pid;
daemon off;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    access_log /var/log/nginx-access.log;
    error_log /var/log/nginx-error.log;

    sendfile on;
    keepalive_timeout 65;
    
    server_names_hash_bucket_size 128;

    client_body_temp_path /var/lib/nginx/body;
    proxy_temp_path /var/lib/nginx/proxy;
    fastcgi_temp_path /var/lib/nginx/fastcgi;

    server {
        listen PORT_PLACEHOLDER;
        listen [::]:PORT_PLACEHOLDER;
        server_name localhost;
        root /app/public;

        # Segurança: Headers de proteção
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "no-referrer-when-downgrade";
        
        client_max_body_size 35M;
        index index.php;
        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        # BLOQUEIO CRÍTICO: Não permite execução de PHP em pastas de assets/upload
        location ~ ^/(storage|uploads|assets|wp-content|wp-includes|cgi-bin)/.*\.php$ {
            deny all;
        }

        # BLOQUEIO CRÍTICO: Restringe execução PHP apenas para o index.php (ou apenas arquivos existentes)
        location ~ \.php$ {
            # Garante que o arquivo PHP existe antes de passar para o FPM (evita RCE em alguns cenários)
            try_files $uri =404;
            
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include /assets/fastcgi_params;
            
            # Prevenção de Buffer Overflow
            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;
            fastcgi_busy_buffers_size 256k;
        }

        # Nega acesso a arquivos ocultos (.env, .git, etc)
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
'''

